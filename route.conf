# Nginx route snippet for https://withkeya.com/cutsheet/
# Include inside the existing withkeya.com HTTPS `server { ... }` block
# (same convention as yingshi-studio's /h3-studio/ route).

location = /cutsheet {
    return 301 /cutsheet/;
}

location ^~ /cutsheet/ {
    client_max_body_size 2m;
    # High-effort reasoning (gpt-6.2-sol / gemini-4-neon) + SSE streams need long read timeouts
    proxy_read_timeout 960s;
    proxy_send_timeout 960s;
    proxy_pass http://127.0.0.1:3780/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /cutsheet;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
}
