<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>开拍台 · CutSheet Studio</title>
  <meta name="description" content="自媒体拍摄脚本 Agent 工作台：主题映射时长、多维创意发散、逐镜分镜与顺场实拍方案，支持 GPT-6.2 Sol 与 Gemini 4 Neon（High）。" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/studio.css" />
</head>
<body>
  <header class="studio-bar">
    <div class="bar-left">
      <button id="btn-toggle-rail" class="btn btn-ghost btn-icon" type="button" title="历史记录" aria-label="切换历史记录">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="15" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
      <button id="btn-brand-home" class="brand-mark" type="button">
        <span class="brand-emblem" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <line x1="3" y1="10" x2="21" y2="10" />
            <line x1="8" y1="5" x2="6" y2="10" />
            <line x1="15" y1="5" x2="13" y2="10" />
          </svg>
        </span>
        <span>
          <span class="brand-title">开拍台</span>
          <span class="brand-sub">CutSheet</span>
        </span>
      </button>
    </div>

    <div class="bar-right">
      <button id="btn-guest-modal" class="btn btn-ghost btn-sm" type="button">
        <span id="guest-badge-label">游客模式</span>
      </button>

      <button id="btn-open-gateway" class="gateway-pill" type="button">
        <span id="gateway-status-dot" class="status-dot"></span>
        <span id="gateway-pill-text">模型网关</span>
      </button>

      <button id="btn-new-topic" class="btn btn-dark btn-sm" type="button">+ 新主题</button>
    </div>
  </header>

  <div id="studio-shell" class="studio-shell">
    <aside id="history-rail" class="history-rail" aria-label="历史策划">
      <div class="rail-head">
        <span class="rail-title">历史策划</span>
        <span id="rail-count" class="mono" style="font-size:0.75rem;color:var(--ink-muted)">0</span>
      </div>
      <div id="history-list" class="rail-list">
        <div class="rail-empty">暂无记录</div>
      </div>
      <div class="rail-foot">游客模式 · 自动保存</div>
    </aside>

    <main class="workspace">
      <section id="composer-section" class="composer-card" aria-label="输入主题">
        <div class="composer-head">
          <h1 class="composer-title">输入主题，生成片长、创意与实拍脚本</h1>
        </div>

        <label class="sr-only" for="topic-input">拍摄主题</label>
        <textarea
          id="topic-input"
          class="topic-box"
          placeholder="输入想拍的主题或灵感，例如：上海安福路松弛感背后的商业账本..."
          rows="2"
        ></textarea>

        <div class="sample-strip" aria-label="示例主题">
          <span class="sample-label">示例：</span>
          <button type="button" class="sample-chip" data-sample="上海安福路“松弛感”背后的商业流量账本">安福路松弛感账本</button>
          <button type="button" class="sample-chip" data-sample="30平米出租屋不砸墙，花500元拍出杂志感改造">500元出租屋改造</button>
          <button type="button" class="sample-chip" data-sample="为什么大厂人离职第一年最容易陷入隐形焦虑">离职第一年焦虑</button>
          <button type="button" class="sample-chip" data-sample="百元内真正提升书桌质感的3件小物">百元桌面3件小物</button>
        </div>

        <div class="controls-grid">
          <div class="field">
            <label class="field-label" for="select-platform">平台</label>
            <select id="select-platform" class="select">
              <option value="auto" selected>智能匹配</option>
              <option value="抖音">抖音</option>
              <option value="小红书">小红书</option>
              <option value="视频号">视频号</option>
              <option value="B站">B站</option>
              <option value="YouTube">YouTube</option>
            </select>
          </div>

          <div class="field">
            <label class="field-label" for="select-duration">时长</label>
            <select id="select-duration" class="select">
              <option value="" selected>自动映射</option>
              <option value="15">15 秒</option>
              <option value="30">30 秒</option>
              <option value="45">45 秒</option>
              <option value="60">60 秒</option>
              <option value="90">90 秒</option>
              <option value="120">120 秒</option>
              <option value="180">180 秒</option>
            </select>
          </div>

          <div class="field">
            <label class="field-label" for="select-idea-count">创意数</label>
            <select id="select-idea-count" class="select">
              <option value="4">4 个</option>
              <option value="6" selected>6 个</option>
              <option value="8">8 个</option>
            </select>
          </div>

          <div class="field">
            <label class="field-label" for="select-route-mode">模型（High）</label>
            <select id="select-route-mode" class="select">
              <option value="auto">自动优选</option>
              <option value="openai">OpenAI · gpt-6.2-sol</option>
              <option value="google">Google · gemini-4-neon</option>
              <option value="hybrid">混编 · Neon + Sol</option>
              <option value="sandbox">演示沙盒</option>
            </select>
          </div>
        </div>

        <button id="btn-toggle-advanced" class="advanced-toggle" type="button" aria-expanded="false">
          <span>+ 补充人设与器材（可选）</span>
        </button>

        <div id="advanced-fields" class="advanced-grid hidden">
          <div class="field">
            <label class="field-label" for="input-persona">人设风格</label>
            <input id="input-persona" class="input" type="text" placeholder="如：克制冷峻的商业观察者" />
          </div>
          <div class="field">
            <label class="field-label" for="input-resources">拍摄条件</label>
            <input id="input-resources" class="input" type="text" placeholder="如：单人手机+麦，预算100元内" />
          </div>
        </div>

        <div class="composer-actions">
          <label class="checkbox-label">
            <input id="check-auto-expand" type="checkbox" checked />
            <span>自动展开首选 Idea 为完整脚本</span>
          </label>

          <div class="action-group">
            <button id="btn-cancel-run" class="btn btn-ghost hidden" type="button">停止</button>
            <button id="btn-run-agent" class="btn btn-primary" type="button">
              <span>开始生成</span>
            </button>
          </div>
        </div>
      </section>

      <section id="agent-trace-panel" class="trace-card hidden" aria-live="polite">
        <div class="trace-header">
          <div class="trace-title-row">
            <span id="trace-dot" class="status-dot running"></span>
            <span id="trace-status-text">执行中…</span>
          </div>
          <button id="btn-toggle-trace-details" class="btn btn-ghost btn-sm" type="button">详情</button>
        </div>
        <div id="trace-steps" class="trace-steps"></div>
        <div id="trace-details" class="trace-details hidden"></div>
      </section>

      <section id="duration-section" class="studio-section hidden" aria-label="时长映射">
        <div class="section-bar">
          <h2 class="section-heading">时长映射</h2>
          <span id="duration-engine-badge" class="tag mono"></span>
        </div>
        <div id="duration-content"></div>
      </section>

      <section id="ideas-section" class="studio-section hidden" aria-label="创意方向">
        <div class="section-bar">
          <div>
            <h2 class="section-heading">创意方向 <span id="ideas-count-badge" class="mono" style="font-size:0.9rem;color:var(--ink-muted)"></span></h2>
            <p id="ideas-summary-copy" class="section-sub"></p>
          </div>
          <button id="btn-more-ideas" class="btn btn-sm" type="button">+ 再发散 4 个</button>
        </div>
        <div id="ideas-grid" class="ideas-grid"></div>
      </section>

      <section id="script-section" class="studio-section hidden" aria-label="实拍脚本">
        <div class="section-bar">
          <h2 class="section-heading">实拍脚本</h2>
        </div>
        <div id="script-tabs" class="script-tabs"></div>
        <div id="script-dossier-container"></div>
      </section>
    </main>
  </div>

  <div id="drawer-backdrop" class="drawer-backdrop"></div>

  <aside id="gateway-drawer" class="side-drawer" aria-label="模型网关设置">
    <div class="drawer-head">
      <h3 style="font-family:var(--font-serif);font-size:1.15rem;">模型网关</h3>
      <button id="btn-close-gateway" class="btn btn-ghost btn-icon" type="button" aria-label="关闭">✕</button>
    </div>

    <div class="drawer-body">
      <div class="field">
        <label class="field-label" for="drawer-route-mode">调度模式</label>
        <select id="drawer-route-mode" class="select">
          <option value="auto">自动优选（有 Key 走真模型）</option>
          <option value="openai">OpenAI（gpt-6.2-sol · High）</option>
          <option value="google">Google（gemini-4-neon · High）</option>
          <option value="hybrid">混编（Neon 发散 + Sol 编排）</option>
          <option value="sandbox">本地沙盒</option>
        </select>
      </div>

      <div class="provider-panel">
        <div class="provider-panel-head">
          <span class="provider-panel-title">OpenAI</span>
          <span id="openai-key-status" class="tag">未配置</span>
        </div>

        <div class="field">
          <label class="field-label" for="openai-api-key">API Key（留空则用服务端配置）</label>
          <input id="openai-api-key" class="input mono" type="password" placeholder="sk-..." autocomplete="off" />
        </div>

        <div class="provider-row-2">
          <div class="field">
            <label class="field-label" for="openai-model">模型</label>
            <input id="openai-model" class="input mono" list="openai-model-list" value="gpt-6.2-sol" />
            <datalist id="openai-model-list">
              <option value="gpt-6.2-sol"></option>
              <option value="gpt-6.2-astra"></option>
              <option value="gpt-6.1-terra"></option>
            </datalist>
          </div>
          <div class="field">
            <label class="field-label" for="openai-effort">思考强度</label>
            <select id="openai-effort" class="select mono">
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high" selected>high</option>
              <option value="xhigh">xhigh</option>
              <option value="max">max</option>
            </select>
          </div>
        </div>

        <div class="provider-row-2">
          <div class="field">
            <label class="field-label" for="openai-protocol">协议</label>
            <select id="openai-protocol" class="select">
              <option value="responses" selected>Responses API</option>
              <option value="chat_completions">Chat Completions</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="openai-base-url">Base URL</label>
            <input id="openai-base-url" class="input mono" type="url" value="https://api.openai.com/v1" />
          </div>
        </div>

        <div style="display:flex;justify-content:flex-end;">
          <button id="btn-test-openai" class="btn btn-sm" type="button">测试连接</button>
        </div>
        <div id="openai-test-result" class="test-result"></div>
      </div>

      <div class="provider-panel">
        <div class="provider-panel-head">
          <span class="provider-panel-title">Google Gemini</span>
          <span id="google-key-status" class="tag">未配置</span>
        </div>

        <div class="field">
          <label class="field-label" for="google-api-key">API Key（留空则用服务端配置）</label>
          <input id="google-api-key" class="input mono" type="password" placeholder="AIza..." autocomplete="off" />
        </div>

        <div class="provider-row-2">
          <div class="field">
            <label class="field-label" for="google-model">模型</label>
            <input id="google-model" class="input mono" list="google-model-list" value="gemini-4-neon" />
            <datalist id="google-model-list">
              <option value="gemini-4-neon"></option>
              <option value="gemini-4-argon"></option>
              <option value="gemini-4-hydrogen"></option>
              <option value="gemini-4-carbon"></option>
            </datalist>
          </div>
          <div class="field">
            <label class="field-label" for="google-effort">思考强度</label>
            <select id="google-effort" class="select mono">
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high" selected>high</option>
              <option value="xhigh">xhigh</option>
            </select>
          </div>
        </div>

        <div class="provider-row-2">
          <div class="field">
            <label class="field-label" for="google-protocol">协议</label>
            <select id="google-protocol" class="select">
              <option value="generate_content" selected>generateContent</option>
              <option value="interactions">Interactions API</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="google-base-url">Base URL</label>
            <input id="google-base-url" class="input mono" type="url" value="https://generativelanguage.googleapis.com/v1beta" />
          </div>
        </div>

        <div style="display:flex;justify-content:flex-end;">
          <button id="btn-test-google" class="btn btn-sm" type="button">测试连接</button>
        </div>
        <div id="google-test-result" class="test-result"></div>
      </div>
    </div>

    <div class="drawer-foot">
      <button id="btn-clear-keys" class="btn btn-ghost btn-sm" type="button">清空本地 Key</button>
      <button id="btn-save-gateway" class="btn btn-primary" type="button">保存</button>
    </div>
  </aside>

  <div id="guest-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="guest-modal-title">
    <div class="modal-card">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <h3 id="guest-modal-title" class="serif" style="font-size:1.15rem;">游客工作区</h3>
        <button id="btn-close-guest-modal" class="btn btn-ghost btn-icon" type="button">✕</button>
      </div>
      <div class="field">
        <label class="field-label" for="guest-nickname-input">昵称</label>
        <input id="guest-nickname-input" class="input" type="text" maxlength="32" />
      </div>
      <div class="field">
        <label class="field-label" for="guest-token-display">同步口令</label>
        <div style="display:flex;gap:8px;">
          <input id="guest-token-display" class="input mono" type="text" readonly />
          <button id="btn-copy-guest-token" class="btn btn-sm" type="button">复制</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="guest-switch-input">切换工作区</label>
        <div style="display:flex;gap:8px;">
          <input id="guest-switch-input" class="input mono" type="text" placeholder="粘贴 gst_... 口令" />
          <button id="btn-switch-guest" class="btn btn-sm" type="button">切换</button>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;">
        <button id="btn-save-guest" class="btn btn-primary" type="button">保存</button>
      </div>
    </div>
  </div>

  <div id="shot-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="shot-modal-title">
    <div class="modal-card">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <h3 id="shot-modal-title" class="serif" style="font-size:1.1rem;">微调分镜</h3>
        <button id="btn-close-shot-modal" class="btn btn-ghost btn-icon" type="button">✕</button>
      </div>
      <input id="edit-shot-index" type="hidden" />
      <div class="provider-row-2">
        <div class="field">
          <label class="field-label" for="edit-shot-phase">段落</label>
          <input id="edit-shot-phase" class="input" type="text" />
        </div>
        <div class="field">
          <label class="field-label" for="edit-shot-seconds">时长（秒）</label>
          <input id="edit-shot-seconds" class="input mono" type="number" min="2" max="60" />
        </div>
      </div>
      <div class="provider-row-2">
        <div class="field">
          <label class="field-label" for="edit-shot-size">景别</label>
          <input id="edit-shot-size" class="input" type="text" />
        </div>
        <div class="field">
          <label class="field-label" for="edit-shot-move">运镜</label>
          <input id="edit-shot-move" class="input" type="text" />
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="edit-shot-action">画面动作</label>
        <textarea id="edit-shot-action" class="input" rows="2"></textarea>
      </div>
      <div class="provider-row-2">
        <div class="field">
          <label class="field-label" for="edit-shot-dtype">口播形式</label>
          <select id="edit-shot-dtype" class="select">
            <option value="真人口播">真人口播</option>
            <option value="VO 画外音">VO 画外音</option>
            <option value="纯画面无台词">纯画面无台词</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="edit-shot-sound">音效</label>
          <input id="edit-shot-sound" class="input" type="text" />
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="edit-shot-dialogue">台词</label>
        <textarea id="edit-shot-dialogue" class="input" rows="2"></textarea>
      </div>
      <div class="field">
        <label class="field-label" for="edit-shot-post">后期提示</label>
        <input id="edit-shot-post" class="input" type="text" />
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button id="btn-cancel-shot-edit" class="btn btn-ghost" type="button">取消</button>
        <button id="btn-save-shot-edit" class="btn btn-primary" type="button">保存</button>
      </div>
    </div>
  </div>

  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
